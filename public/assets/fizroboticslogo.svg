<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="fizGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C4FF" />
      <stop offset="100%" stop-color="#1C4463" />
    </linearGradient>
  </defs>

  <!-- Technical Robotics Icon: Stylized Hexagonal Gear / Node Matrix -->
  <g transform="translate(10, 10)">
    <!-- Outer Hex-Shield Outline -->
    <polygon points="50,4 92,28 92,72 50,96 8,72 8,28" stroke="url(#fizGrad)" stroke-width="6" fill="#151515" />
    <!-- Inner Core & Data Nodes -->
    <circle cx="50" cy="50" r="14" fill="url(#fizGrad)" />
    <line x1="50" y1="16" x2="50" y2="36" stroke="#00C4FF" stroke-width="4" stroke-linecap="round" />
    <line x1="50" y1="64" x2="50" y2="84" stroke="#00C4FF" stroke-width="4" stroke-linecap="round" />
    <line x1="20" y1="35" x2="38" y2="44" stroke="#00C4FF" stroke-width="4" stroke-linecap="round" />
    <line x1="62" y1="56" x2="80" y2="65" stroke="#00C4FF" stroke-width="4" stroke-linecap="round" />
    <line x1="80" y1="35" x2="62" y2="44" stroke="#00C4FF" stroke-width="4" stroke-linecap="round" />
    <line x1="38" y1="56" x2="20" y2="65" stroke="#00C4FF" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- High-Precision Wordmark -->
  <g transform="translate(128, 26)">
    <!-- FIZ -->
    <text x="0" y="44" font-family="'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="46" fill="#151515" letter-spacing="-0.03em">
      FIZ
    </text>
    <!-- ROBOTICS -->
    <text x="96" y="44" font-family="'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="46" fill="#1C4463" letter-spacing="-0.02em">
      ROBOTICS
    </text>
    <!-- SUB-DESCRIPTOR: SOLUTIONS / TECHNICAL PARTNER -->
    <text x="2" y="70" font-family="'Space Mono', monospace" font-weight="700" font-size="13" fill="#575757" letter-spacing="0.32em">
      SOLUTIONS · LABS & MECHATRONICS
    </text>
  </g>
</svg>
